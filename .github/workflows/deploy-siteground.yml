name: Deploy website to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: Full SHA of an earlier main commit to redeploy
        type: string
        default: ''
      dry_run:
        description: Show files to upload without changing SiteGround
        type: boolean
        default: false

concurrency:
  group: siteground-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select release commit
        shell: bash
        env:
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          if [ -n "$ROLLBACK_SHA" ]; then
            if [[ ! "$ROLLBACK_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Enter a full 40-character commit SHA." >&2
              exit 1
            fi
            git fetch origin main
            if ! git merge-base --is-ancestor "$ROLLBACK_SHA" origin/main; then
              echo "Rollback commit must be on the main branch." >&2
              exit 1
            fi
            git checkout --detach "$ROLLBACK_SHA"
          fi
          echo "Deploying $(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate audit request delivery and abuse controls
        run: |
          php -l siteground/audit-request.php
          php siteground/audit-request.test.php
      - run: pnpm build:siteground
      - name: Save exact website build
        uses: actions/upload-artifact@v4
        with:
          name: siteground-${{ github.run_id }}
          path: ./out/
          include-hidden-files: true
          retention-days: 14
      - name: Wait for the matching protected admin gateway
        if: ${{ !inputs.dry_run && !inputs.rollback_sha }}
        timeout-minutes: 12
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          if (!readFileSync('scripts/admin-server.mjs', 'utf8').includes('X-Codeflow-Admin-Revision')) process.exit(0);
          const expected = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const deadline = Date.now() + 9 * 60 * 1000;
          while (Date.now() < deadline) {
            try {
              const response = await fetch('https://codeflow-studios-production.up.railway.app/admin/finance/', { redirect: 'manual', cache: 'no-store', signal: AbortSignal.timeout(10000) });
              if (response.status === 303 && response.headers.get('location') === '/admin/login' && response.headers.get('x-codeflow-admin-revision') === expected) {
                console.log('Matching admin gateway is live; anonymous finance access remains protected.');
                process.exit(0);
              }
            } catch { /* Deployment may still be starting. */ }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('The matching protected admin gateway did not become ready. SiteGround was not changed.');
          NODE
      - name: Upload website through FTPS
        uses: docker://ghcr.io/airvzxf/ftp-deployment-action:v2.11.13
        with:
          server: ftp://gnldm1120.siteground.biz:21
          user: ${{ secrets.SITEGROUND_FTP_USER }}
          password: ${{ secrets.SITEGROUND_FTP_PASSWORD }}
          local_dir: ./out/
          remote_dir: ./
          max_retries: '1'
          delete: 'false'
          dry_run: ${{ inputs.dry_run || 'false' }}
