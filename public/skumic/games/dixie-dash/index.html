const BPM = 172;

let audio, bus, noise, soundOn = true, lastNote = -1;
function enableBeat(){
  if(!soundOn)return;
  const Audio = window.AudioContext || window.webkitAudioContext;
  if(!Audio)return;
  try {
    if(!audio){
      audio=new Audio();
      bus=audio.createGain();bus.gain.value=.32;bus.connect(audio.destination);
      noise=audio.createBuffer(1,Math.ceil(audio.sampleRate*.13),audio.sampleRate);
      const samples=noise.getChannelData(0);
      for(let i=0;i<samples.length;i++)samples[i]=Math.random()*2-1;
    }
    audio.resume().catch(()=>{});
  } catch {}
}
function drumTone(now,from,to,length,volume,wave='sine'){
  const oscillator=audio.createOscillator(), envelope=audio.createGain();
  oscillator.type=wave;
  oscillator.frequency.setValueAtTime(from,now);
  oscillator.frequency.exponentialRampToValueAtTime(to,now+length*.75);
  envelope.gain.setValueAtTime(volume,now);
  envelope.gain.exponentialRampToValueAtTime(.001,now+length);
  oscillator.connect(envelope);envelope.connect(bus);
  oscillator.start(now);oscillator.stop(now+length);
}
function drumNoise(now,frequency,length,volume){
  const hit=audio.createBufferSource(), filter=audio.createBiquadFilter(), envelope=audio.createGain();
  hit.buffer=noise;filter.type='highpass';filter.frequency.value=frequency;
  envelope.gain.setValueAtTime(volume,now);
  envelope.gain.exponentialRampToValueAtTime(.001,now+length);
  hit.connect(filter);filter.connect(envelope);envelope.connect(bus);
  hit.start(now);hit.stop(now+length);
}
function playBeat(){
  const note=Math.floor(elapsed/sixteenth);
  if(note===lastNote)return;
  lastNote=note;
  if(!soundOn||!audio||audio.state!=='running')return;
  const now=audio.currentTime, step=note%16;
  if(step===0||step===10)drumTone(now,140,43,.145,.68);
  if(step===4||step===12){
    drumNoise(now,1100,.11,.48);drumTone(now,185,115,.068,.19,'triangle');
  }
  if(step%2===0||step===15)drumNoise(now,6900,.032,step%4===2?.18:.10);
  if(step===0||step===6||step===10||step===14){
    const bass=[55,49,61.74,43.65][Math.floor(note/16)%4];
    drumTone(now,bass,bass*.98,.17,.24,'triangle');
  }
}
function movePots(){
  const beat=elapsed/(sixteenth*4), difficulty=clamp(elapsed/duration,0,1);
  for(const pot of pots){
    const hopBeat=beat+pot.i%2*.5, phase=hopBeat%1;
    const hop=Math.sin(Math.PI*phase)**.8;
    const direction=pot.i%2===0?1:-1;
    pot.y=pot.homeY-hop*(8+22*difficulty);
    pot.x=pot.homeX+Math.sin(Math.PI*beat+pot.i*.8)*difficulty*5*direction;
  }
}
function resetPots() {
  pots = layouts.map(([x,y,r,points],i) => ({x,y,homeX:x,homeY:y,r,points,i,fill:0,full:false,lid:false,hit:0}));
}
function status(message){ $('status').textContent = message; messageTimer = 2.6; }
function hud(){
  $('score').textContent = score;
  $('best').textContent = Math.max(best,score);
  $('time').textContent = filled+'/'+pots.length;
  $('tank').firstElementChild.style.width = supply+'%';
  $('tank').setAttribute('aria-valuenow',Math.ceil(supply));
}
function clearInput(){keys.clear();held = null;spraying = false;}
function start(){
  lastNote=-1;enableBeat();
  resetPots();clearInput();
  mode='play';elapsed=0;supply=100;score=0;filled=0;streak=0;missTime=0;droplets=[];
  aim={x:248,y:263};spraying=true;
  $('overlay').hidden=true;$('pause').disabled=false;$('pause').textContent='Pauze';
  status('De straal loopt! Mik op de eerste pot.');hud();canvas.focus({preventScroll:true});
}
function finish(){
  mode='over';clearInput();
  const record = score > best;
  if(record){best=score;try{localStorage.setItem('skumic-dixie-dash-best',String(best));}catch{}}
  $('pause').disabled=true;$('overlay').hidden=false;$('picks').hidden=false;
  $('title').textContent=record?'NIEUW RECORD':'RONDE VOORBIJ';
  $('intro').textContent=score+' punten · '+filled+(filled===1?' gevulde pot':' gevulde potten')+' · Record '+best;

}
function pause(){
  if(mode==='play'){
    mode='paused';clearInput();$('overlay').hidden=false;$('picks').hidden=true;
    $('title').textContent='PAUZE';$('intro').textContent='Je ronde staat stil.';
    $('play').textContent='SPEEL VERDER';$('pause').textContent='Verder';
  } else if(mode==='paused'){

  }
}

const controls=['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d'];
window.addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();

  if(mode==='play'&&controls.includes(key)){e.preventDefault();keys.add(key);}
});

window.addEventListener('blur',()=>{if(mode==='play')pause();});
function point(e){
  const r=canvas.getBoundingClientRect();
  aim.x=clamp((e.clientX-r.left)/r.width*W,238,W-8);
  aim.y=clamp((e.clientY-r.top)/r.height*H,30,H-10);

canvas.addEventListener('pointerdown',e=>{

  const x=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0);
  const y=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('w')?1:0);
  aim.x=clamp(aim.x+x*210*dt,238,W-8);aim.y=clamp(aim.y+y*210*dt,30,H-10);

}
function drawDixie(x,y,w,h,i){
  const c=['#627d88','#434b73','#6a496c','#415d6a','#6c4661','#505578'][i];
  const edge=Math.round(w*.15);
  ellipse(x+w*.61,y+h+2,w*.61,8,'#1109189e');
  polygon([[x,y],[x+12,y-11],[x+w+edge,y-11],[x+w,y]],'#232037');
  polygon([[x+w,y],[x+w+edge,y-11],[x+w+edge,y+h-12],[x+w,y+h]],'#262338');
  rect(x,y,w,h,c);rect(x+2,y+3,w-4,3,'#947da4');rect(x+5,y+12,w-10,h-19,'#221d35');
  rect(x+8,y+14,w-16,h-22,c);
  for(let j=0;j<4;j++){const seam=x+14+j*(w-23)/4;rect(seam,y+31,2,h-43,'#24192f65');rect(seam+2,y+31,1,h-43,'#e7c4ec25');}
  rect(x+1,y+h-8,w-2,7,'#1a192b');rect(x+9,y+12,w-18,10,'#292038');
  label('DIXIE',x+w/2,y+20,'#cdbed7');
  rect(x+w-15,y+h*.55,6,10,'#272036');rect(x+w-13,y+h*.55+2,5,2,'#b1a5b8');
  rect(x+3,y+31,3,5,'#b0a1b3');rect(x+3,y+h-32,3,5,'#b0a1b3');
}
function drawVenue(){
  rect(0,0,W,H,'#21172d');
  if(background.complete&&background.naturalWidth)ctx.drawImage(background,0,0,W,H);
  const shade=ctx.createLinearGradient(0,0,0,H);
  shade.addColorStop(0,'#100a2300');shade.addColorStop(1,'#150c2a79');rect(0,0,W,H,shade);
  for(let i=5;i>=0;i--)drawDixie(30+i*91,109-i*5,80,123-i*2,i);
  rect(145,230,78,5,'#c286743d');
  ellipse(181,328,44,11,'#100719c0');
  const art=rearSprites[player];
  if(art?.complete&&art.naturalWidth){
    const h=157,w=h*art.naturalWidth/art.naturalHeight;
    const lean=mode==='play'?clamp((aim.y-235)*.025,-3,3):0;
    ctx.save();ctx.translate(178+lean,172);ctx.drawImage(art,-w/2,0,w,h);ctx.restore();
  }
  label(player.toUpperCase(),178,347,'#f8e480');
}
function drawPot(p){
  const {x,y,r}=p, h=Math.round(r*1.48), wet=p.fill;
  ellipse(x+3,p.homeY+h+6,r+9,6,'#120c23ab');
  polygon([[x-r,y],[x+r,y],[x+r*.68,y+h],[x-r*.68,y+h]],'#8c7eaa');
  polygon([[x+r*.28,y],[x+r,y],[x+r*.68,y+h],[x+r*.18,y+h]],'#5e537e');
  polygon([[x-r*.7,y+4],[x-r*.39,y+5],[x-r*.33,y+h-2],[x-r*.48,y+h]],'#b7adcc');
  ellipse(x,y+h,r*.68,4,'#71638e');
  ellipse(x,y,r+2,r*.51,p.hit?'#fde589':'#b8aaca');
  ellipse(x,y,r-2,r*.39,p.lid?'#766294':'#342443');
  if(p.lid){ellipse(x,y-1,r-3,r*.26,'#9c89b0');rect(x-4,y-4,8,2,'#dbc9e7');}
  else if(wet>0)ellipse(x,y+1,(r-2)*Math.sqrt(wet),r*.33*Math.sqrt(wet),'#efd67d');
  const state=p.full?'VOL':p.lid?'DICHT':p.warning?'SLUIT':String(p.points);
  label(state,x,y-r*.52-5,p.lid||p.warning?'#ffadda':'#fff0bb');
  rect(x-r,y+h+10,r*2,4,'#20132e');rect(x-r,y+h+10,r*2*wet,4,'#f8de7c');
}
function render(){
  ctx.imageSmoothingEnabled=false;
  drawVenue();
  for(const p of [...pots].reverse())drawPot(p);
  if(mode!=='play')return;
  const pot=aimedPot(), active=pot&&!pot.lid&&!pot.full;
  const x=active?pot.x:aim.x,y=active?pot.y:aim.y;
  if(active){
    ctx.strokeStyle='#fff1b8';ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(pot.x,pot.y,pot.r+4,pot.r*.64,0,0,Math.PI*2);ctx.stroke();
  }
  if(spraying){
    const wave=!reducedMotion&&spraying?Math.sin(elapsed*32)*1.4:0;
    ctx.beginPath();ctx.moveTo(source.x,source.y);
    ctx.quadraticCurveTo((source.x+x)/2,Math.min(source.y,y)-53+wave,x,y);
    ctx.lineWidth=2.4;ctx.strokeStyle='#ffeb86';ctx.stroke();
  }
  for(const d of droplets)rect(d.x,d.y,2,2,'#f9e467');
  const power=Math.max(0,1-(elapsed/(sixteenth*4)%1)*3);
  rect(20,20,40,3,'#5b3159');
  rect(20,20,40*power,3,'#ffa5d0');
  label('172 BPM',40,15,'#ffd6f1');
  rect(aim.x-8,aim.y,5,1,'#fff6d8');rect(aim.x+4,aim.y,5,1,'#fff6d8');
  rect(aim.x,aim.y-8,1,5,'#fff6d8');rect(aim.x,aim.y+4,1,5,'#fff6d8');
}
function frame(ms){const dt=last?Math.min(.05,(ms-last)/1000):0;last=ms;step(dt);render();requestAnimationFrame(frame);}
resetPots();hud();requestAnimationFrame(frame);
</script></body></html>
