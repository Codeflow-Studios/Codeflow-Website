<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11151b">
  <meta name="description" content="Verken als Gauthier of Matar een 3D-festival in 128-bit-consolestijl en wandel naar de drie Skumic-games.">
  <link rel="canonical" href="https://codeflowstudios.be/festival/">
  <link rel="icon" href="/skumic/assets/logo.webp" type="image/webp">
  <link rel="stylesheet" href="/festival/style.css?v=artists-01">
  <script type="importmap">
    { "imports": {
      "/festival/world.js": "/festival/world.js?v=console-128",
      "/festival/layout.js": "/festival/layout.js?v=open-paths",
      "/festival/flat-world.js": "/festival/flat-world.js?v=artists-01",
      "/festival/characters.js": "/festival/characters.js?v=console-128",
      "/festival/pixel-renderer.js": "/festival/pixel-renderer.js?v=console-128",
      "/festival/performer-model.js": "/festival/performer-model.js?v=console-128",
      "/festival/stage-art.js": "/festival/stage-art.js?v=console-128",
      "/festival/console-lighting.js": "/festival/console-lighting.js?v=console-128",
      "/festival/crowd-models.js": "/festival/crowd-models.js?v=console-128",
      "/festival/terrain.js": "/festival/terrain.js?v=console-128"
    } }
  </script>
  <title>Skumic Festival</title>
</head>
<body>
  <main id="festival">
    <div id="world" tabindex="0" role="region" aria-label="Festivalterrein. Loop met de pijltjestoetsen, ZQSD of WASD en druk bij een stand op E."></div>
    <div class="vignette" aria-hidden="true"></div>
    <div id="world-signs" aria-label="Gamestands"></div>

    <header class="wordmark" aria-label="Skumic Festival">
      <a class="wordmark-top" href="/skumic/arcade/" aria-label="Naar Skumic Arcade"><span class="spark" aria-hidden="true">✦</span><span>SKUMIC</span></a>
      <h1>FESTIVAL</h1>
      <div class="visit-status" aria-live="polite">
        <span id="visit-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="visit-count">0 van 3 stands bezocht</span>
      </div>
      <button id="change-artist" class="change-artist" type="button" aria-haspopup="dialog" hidden>
        <span id="artist-name"></span><span>Wisselen</span>
      </button>
    </header>

    <aside class="map-panel" aria-label="Plattegrond van het festival">
      <button class="map-heading" id="map-toggle" type="button" aria-expanded="true" aria-controls="map-content">
        <span class="map-symbol" aria-hidden="true"></span><span>Plattegrond</span><span class="map-caret" aria-hidden="true"></span>
      </button>
      <div id="map-content">
        <div class="map-image"><canvas id="minimap" width="424" height="300" aria-label="Overzicht van de drie stands en je positie"></canvas><span class="north" aria-hidden="true">N</span></div>
        <div id="map-legend" aria-label="Kies een stand om aan te wijzen"></div>
      </div>
      <button class="camera-toggle" id="camera-toggle" type="button" hidden>Vogelperspectief</button>
    </aside>

    <div class="bottom-ui">
      <div id="nearby" class="nearby" hidden>
        <div class="nearby-copy"><span id="nearby-type" class="eyebrow"></span><strong id="nearby-title"></strong></div>
        <button class="play-button" id="enter-game" type="button"><kbd>E</kbd><span>Speel</span></button>
      </div>
      <div id="walk-hint" class="walk-hint">Loop naar een podium om te spelen</div>
      <div class="keyboard" aria-label="Besturing">
        <span><kbd>ZQSD</kbd> <kbd>WASD</kbd> <kbd>↑↓←→</kbd> <span>Lopen</span></span>
        <span><kbd>Shift</kbd> <span>Rennen</span></span>
        <span><kbd>E</kbd> <span>Spelen</span></span>
      </div>
    </div>

    <div id="joystick" class="joystick" aria-hidden="true"><span id="joystick-knob"></span></div>
    <div id="notice" class="notice" aria-live="polite" hidden></div>
    <div id="loading" class="loading" role="status">Festivalterrein laden…</div>
    <noscript><p class="loading">Zet JavaScript aan om het festivalterrein te spelen.</p></noscript>
  </main>

  <dialog id="artist-dialog" aria-labelledby="artist-heading">
    <div class="artist-heading">
      <h2 id="artist-heading">Kies je artiest</h2>
      <button type="button" id="cancel-artist" aria-label="Sluiten" hidden>×</button>
    </div>
    <div class="artist-lineup">
      <button type="button" class="artist-card" data-artist="gauthier">
        <img src="/festival/avatars/gauthier.png" alt="" width="128" height="150">
        <strong>Gauthier</strong>
      </button>
      <button type="button" class="artist-card" data-artist="matar">
        <img src="/festival/avatars/matar.png" alt="" width="128" height="150">
        <strong>Matar</strong>
      </button>
    </div>
  </dialog>

  <dialog id="game-dialog" aria-labelledby="game-title">
    <div class="game-bar">
      <button type="button" id="back-to-festival">Terug naar festival</button>
      <div class="game-ident">
        <strong id="game-title"></strong>
        <span id="game-input-note" hidden>Gebruik een toetsenbord</span>
      </div>
      <a id="open-separately" target="_blank" rel="noopener noreferrer">Nieuw tabblad</a>
    </div>
    <div id="game-view" class="game-view"></div>
  </dialog>
  <script type="module" src="/festival/main.js?v=arcade-32"></script>
</body>
</html>
